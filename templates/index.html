<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Recap Studio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #101114;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #999;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            min-height: 300px;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #333;
            background: #191b20;
            color: white;
            font-size: 15px;
            line-height: 1.6;
            resize: vertical;
            outline: none;
        }

        select,
        button {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
        }

        select {
            background: #191b20;
            color: white;
            border: 1px solid #333;
        }

        button {
            background: #ffffff;
            color: #111;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        .output {
            margin-top: 25px;
        }

        .box {
            background: #191b20;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            margin-top: 12px;
        }

        .box h3 {
            margin-top: 0;
        }

        .download {
            display: block;
            text-align: center;
            background: #2a2d35;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
        }

        #status {
            text-align: center;
            margin-top: 15px;
            color: #aaa;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎬 Movie Recap Studio</h1>

    <div class="subtitle">
        Transcript → Myanmar Recap → MP3 → SRT
    </div>

    <label>🎞️ Transcript</label>

    <textarea
        id="transcript"
        placeholder="ဒီနေရာမှာ ဇာတ်ကား Transcript ကို Paste လုပ်ပါ..."
    ></textarea>

    <label>📝 Recap Style</label>

    <select id="style">
        <option value="natural">Natural Movie Recap</option>
        <option value="fast">Fast & Engaging</option>
        <option value="cinematic">Cinematic</option>
    </select>

    <label>🎙️ Voice</label>

    <select id="voice">
        <option value="male">Male</option>
        <option value="female">Female</option>
    </select>

    <label>⚡ Speed</label>

    <select id="speed">
        <option value="0.9">0.9x</option>
        <option value="1.0" selected>1.0x</option>
        <option value="1.1">1.1x</option>
        <option value="1.2">1.2x</option>
        <option value="1.3">1.3x</option>
    </select>

    <button onclick="generateRecap()">
        🚀 Generate Recap
    </button>

    <div id="status"></div>

    <div class="output">

        <div class="box">
            <h3>📝 Recap Script</h3>

            <textarea
                id="script"
                placeholder="Recap script ဒီမှာပေါ်ပါမယ်..."
            ></textarea>
        </div>

        <div class="box">
            <h3>🎙️ MP3</h3>

            <audio id="audio" controls style="width:100%;"></audio>

            <a
                id="mp3Download"
                class="download"
                style="display:none;"
            >
                ⬇️ Download MP3
            </a>
        </div>

        <div class="box">
            <h3>💬 SRT</h3>

            <a
                id="srtDownload"
                class="download"
                style="display:none;"
            >
                ⬇️ Download SRT
            </a>
        </div>

    </div>

</div>

<script>

async function generateRecap() {

    const transcript =
        document.getElementById("transcript").value.trim();

    const style =
        document.getElementById("style").value;

    const voice =
        document.getElementById("voice").value;

    const speed =
        document.getElementById("speed").value;

    const status =
        document.getElementById("status");

    if (!transcript) {
        alert("Transcript ထည့်ပေးပါ။");
        return;
    }

    status.innerText = "⏳ Processing...";

    try {

        const response = await fetch("/api/recap", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                transcript: transcript,
                style: style,
                voice: voice,
                speed: speed
            })

        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Something went wrong");
        }

        document.getElementById("script").value =
            data.script;

        if (data.mp3) {

            const audio =
                document.getElementById("audio");

            audio.src = data.mp3;

            const mp3Download =
                document.getElementById("mp3Download");

            mp3Download.href = data.mp3;
            mp3Download.download = "movie-recap.mp3";
            mp3Download.style.display = "block";
        }

        if (data.srt) {

            const srtDownload =
                document.getElementById("srtDownload");

            srtDownload.href = data.srt;
            srtDownload.download = "movie-recap.srt";
            srtDownload.style.display = "block";
        }

        status.innerText = "✅ Recap ပြီးပါပြီ";

    } catch (error) {

        status.innerText =
            "❌ Error: " + error.message;

    }

}

</script>

</body>
</html>
